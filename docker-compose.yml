services:
  fastapi:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
      - minio
    environment:
      - DATABASE_URL=postgresql+asyncpg://plum:plum123@postgres:5432/claims
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123
      - MINIO_BUCKET=claims

  worker:
    build: ./backend
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=1 -n worker1@%h
    shm_size: '2gb'
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - redis
      - fastapi
      - postgres
      - minio
    environment:
      - DATABASE_URL=postgresql+asyncpg://plum:plum123@postgres:5432/claims
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123
      - MINIO_BUCKET=claims

  redis:
    image: redis:6.2-alpine
    ports:
      - "6380:6379"  # Changed from 6379:6379 to 6380:6379

  postgres:
    image: postgres:13-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=plum
      - POSTGRES_PASSWORD=plum123
      - POSTGRES_DB=claims
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin123
    command: server /data --console-address ":9001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - WATCHPACK_POLLING=true
    depends_on:
      - fastapi

  prometheus:
    image: prom/prometheus:v2.37.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - fastapi

  grafana:
    image: grafana/grafana:8.5.2
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  minio_data: